name: Watch production

# Checks the live site after every production deployment and every six hours, and raises an issue when it fails.
on:
  deployment_status:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-production
  cancel-in-progress: false

jobs:
  smoke:
    name: IWD production
    # Vercel reports every deployment here; only a successful production one is worth checking.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    env:
      PLAYWRIGHT_BASE_URL: https://internation-women-day-delta.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.36.0
      - run: corepack yarn install --immutable
      - run: corepack yarn exec playwright install --with-deps chromium
      # Deployment checks hold the domain until CI passes, so wait until it serves this commit.
      - name: Wait for the domain to serve this deployment
        if: github.event_name == 'deployment_status'
        env:
          EXPECTED: ${{ github.event.deployment.sha }}
        run: |
          want="${EXPECTED:0:12}"
          for attempt in $(seq 1 60); do
            served=$(curl -sfI "$PLAYWRIGHT_BASE_URL/" | tr -d '\r' | awk -F': ' 'tolower($1) == "x-build" { print $2 }')
            if [ "$served" = "$want" ]; then echo "Serving $want"; exit 0; fi
            echo "Waiting for $want (serving ${served:-nothing})"
            sleep 15
          done
          echo "::error::Production did not start serving $want within 15 minutes."
          exit 1
      - run: corepack yarn test:smoke
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Raise the alarm
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Production check failed"
          body="The live site failed its checks ($GITHUB_EVENT_NAME, ${GITHUB_SHA:0:12}): $RUN_URL"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
